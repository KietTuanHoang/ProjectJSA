<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="shortcut icon" href="../img/logo.png" type="image/x-icon">
    <style>
        .imgFilm {
            aspect-ratio: 2/3;
        }
    </style>
</head>

<body>
    <nav class="navbar md:navbar-expand bg-1 fixed-top" style="background-color: #ae0000;">
        <div class="container-fluid">
            <a class="navbar-brand" href="../../"><img src="../img/logo.png" alt="" height="50px"></a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer"
                aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body mb-2 md:mb-0">
                    <ul class="nav navbar-nav me-auto" id="menuList">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="../../" style="color: white">Home</a>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" type="button" data-bs-toggle="menu" aria-expanded="false"
                                style="color: white">
                                Menu
                            </button>
                            <div class="menu" style="background-color: #ae0000;">
                                <a class=" menu-item ingre" href="../../#Beef" style="color: white">Beef</a>
                                <a class=" menu-item ingre" href="../../#Chicken" style="color: white">Chicken</a>
                                <a class=" menu-item ingre" href="../../#Lamb" style="color: white">Lamb</a>
                                <a class=" menu-item ingre" href="../../#Pork" style="color: white">Pork</a>
                                <a class=" menu-item ingre" href="../../#Salmon" style="color: white">Salmon</a>
                            </div>
                        </li>
                    </ul>
                    <form class="hstack gap-2" role="search">
                        <input class="form-control" type="search" placeholder="Search" aria-label="Search" />
                        <button class="btn-solid btn-icon theme-secondary" type="submit">
                            <svg class="bi" width="16" height="16">
                                <use href="#search" />
                            </svg>
                        </button>
                        <button class="btn-solid theme-danger d-none" type="button" id="logout">Log out</button>
                    </form>
                </div>
            </dialog>
        </div>
    </nav>


    <div class="container text-center" style="margin-top: 100px;">
        <h1 id="resultNumber">Result</h1>
        <div class="row align-items-start" id="result">
        </div>
    </div>




    <!-- Bản quyền - copyright -->
    <div id="copyright" class=" text-center  mt-5"
        style="height: 60px; line-height: 60px;color: white; background-color: #ae0000;">
        © 2026, ThemealDb.com
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <script src="../js/searchMeal.js"></script>
    <script src="../js/loginCheckSub.js"></script>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>meal</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <form id="registerForm" class="p-5 text-white">
        <h4 class="text-center">REGISTER FORM</h4>
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="username" placeholder="Username">
            <label for="username">Username</label>
        </div>
        <div class="form-floating mb-3">
            <input type="name" class="form-control" id="inputName" placeholder="name">
            <label for="inputName">Fullname</label>
        </div>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="pwd" placeholder="Password">
            <label for="pwd">Password</label>
        </div>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="cfpwd" placeholder="Password">
            <label for="cfpwd">Confirm Password</label>
        </div>

        <button type="submit" class="w-100 btn btn-success my-3 py-3">Register</button>
        <p class="text-center">Have an account <a href="./login.html" class="link-primary"> Sign up now</a></p>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="../js/register.js"></script>
</body>

</html>
